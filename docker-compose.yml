# Self-hosted stack: website + PostgreSQL.
#   cp .env.example .env   # fill in INGEST_SECRET etc. (DATABASE_URL is overridden below)
#   docker compose up -d --build
#   docker compose run --rm tools db:seed                                   # example listings + welcome post
#   docker compose run --rm tools admin:create -- --email you@example.com --password '<12+ chars>'
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rulexmc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rulexmc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulexmc -d rulexmc"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rulexmc:${POSTGRES_PASSWORD}@db:5432/rulexmc?schema=public
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-off maintenance container (full toolchain: tsx, prisma CLI). Not started by `up`.
  tools:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rulexmc:${POSTGRES_PASSWORD}@db:5432/rulexmc?schema=public
    entrypoint: ["npm", "run"]

volumes:
  pgdata:
